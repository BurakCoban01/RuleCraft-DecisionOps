name: rulecraft-decisionops

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${RULECRAFT_DB_NAME:-rulecraft}
      POSTGRES_USER: ${RULECRAFT_DB_USER:-rulecraft}
      POSTGRES_PASSWORD: ${RULECRAFT_DB_PASSWORD:?Set RULECRAFT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RULECRAFT_DB_PORT:-50112}:5432"
    volumes:
      - rulecraft-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m

volumes:
  rulecraft-postgres:
