spring:
  datasource:
    hikari:
      connection-timeout: 10000
      validation-timeout: 3000
      max-lifetime: 1800000
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
  session:
    timeout: ${RULECRAFT_SESSION_TIMEOUT:30m}

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${RULECRAFT_SESSION_COOKIE_SECURE:true}
        same-site: strict
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 2MB

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  include-application-name: true
  pattern:
    correlation: "[%X{correlationId:-}] "
