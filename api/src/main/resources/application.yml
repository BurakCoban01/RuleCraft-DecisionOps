spring:
  application:
    name: rulecraft-api
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${RULECRAFT_DB_URL:jdbc:postgresql://localhost:50112/rulecraft}
    username: ${RULECRAFT_DB_USER:rulecraft}
    password: ${RULECRAFT_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${RULECRAFT_DB_POOL_SIZE:8}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${RULECRAFT_API_PORT:50110}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

springdoc:
  swagger-ui:
    enabled: false

rulecraft:
  build:
    version: ${RULECRAFT_BUILD_VERSION:0.1.0-dev}
